<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'none'; object-src 'none'; base-uri 'none'">
  <title>MILO world preview</title>
  <style>
    :root { color-scheme: light; }
    html, body { margin: 0; height: 100%; background: #5b9169; overflow: hidden; font: 13px/1.35 "Segoe UI", system-ui, sans-serif; color: #3d4038; }
    #world { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; outline: none; }
    #tip { position: fixed; pointer-events: none; padding: 4px 8px; background: #fff6e2; border: 2px solid #3d4038; box-shadow: 0 3px 0 #3d4038; display: none; white-space: nowrap; }
    #bubble { position: fixed; transform: translate(-50%, calc(-100% - 10px)); padding: 6px 10px; background: #fff6e2; border: 2px solid #3d4038; box-shadow: 0 3px 0 #3d4038; display: none; max-width: 260px; }
    #overview { display: none; image-rendering: pixelated; }
    body.sheet, body.overview { overflow: auto; background: #aad48f; }
  </style>
</head>
<body>
  <canvas id="world" aria-label="Milo's world. Use the arrow keys to walk."></canvas>
  <div id="tip" role="status"></div>
  <div id="bubble">Hi, Chris. All quiet while you were away.</div>
  <script type="module">
    // The world on its own, for screenshots (scripts/capture-world.mjs, capture-wilds.mjs and
    // friends). Query: at=<place id> | x=&y= (start tile), crew=default|rest|busy, motion=0,
    // scale=N, view=overview (milo=0 leaves him out of it), bubble=1, entrance=1. With content injected by an init script
    // (window.__content = { genres, riftgen, fortress, wilds, story }) the wilds come on too:
    // tier=N, day=N, seed=..., rifts=<genre[+genre]:stage:x,y[:warded]>;..., echo=<place:icon:genre>,
    // lit=<lantern ids, comma-separated>, elsewhere=<genre[+genre]:stage[:depth]>.
    // Every rift here is synthetic, built by the rift generator; nothing real is shown.
    import { createWorld } from '../src/world/engine.js';
    import { PLACES } from '../src/world/map.js';

    const params = new URLSearchParams(location.search);
    const canvas = document.getElementById('world');
    const tip = document.getElementById('tip');
    const bubble = document.getElementById('bubble');
    const motionParam = params.get('motion') !== '0';
    const content = window.__content || null;
    const log = [];
    window.__log = log;
    window.__errors = [];
    window.addEventListener('error', (e) => window.__errors.push(String(e.message)));

    const crewSets = {
      default: [
        { id: 'claude', state: 'working', label: 'Claude Code', count: 2 },
        { id: 'codex', state: 'needs-you', label: 'Codex', count: 1 },
        { id: 'jev', state: 'working', label: 'Jev', count: 0 },
        { id: 'whisper', state: 'idle', label: 'Whisper', count: 0 },
        { id: 'ollama', state: 'idle', label: 'Ollama', count: 0 },
        { id: 'helper-a', state: 'done', label: 'Helper', count: 0 },
      ],
      rest: [
        { id: 'claude', state: 'done', label: 'Claude Code', count: 0 },
        { id: 'codex', state: 'done', label: 'Codex', count: 0 },
        { id: 'jev', state: 'idle', label: 'Jev', count: 0 },
        { id: 'whisper', state: 'idle', label: 'Whisper', count: 0 },
        { id: 'ollama', state: 'offline', label: 'Ollama', count: 0 },
      ],
      busy: [
        { id: 'claude', state: 'working', label: 'Claude Code', count: 3 },
        { id: 'codex', state: 'working', label: 'Codex', count: 1 },
        { id: 'ollama', state: 'working', label: 'Ollama', count: 1 },
        { id: 'helper-b', state: 'working', label: 'Helper', count: 1 },
        { id: 'helper-c', state: 'needs-you', label: 'Another helper', count: 1 },
        { id: 'jev', state: 'working', label: 'Jev', count: 0 },
        { id: 'whisper', state: 'idle', label: 'Whisper', count: 0 },
      ],
    };

    const start = params.get('at');
    const startPlace = start ? PLACES.find((p) => p.id === start) : null;
    const startXY = params.has('x') && params.has('y') ? { x: Number(params.get('x')), y: Number(params.get('y')) } : null;
    let motionOn = motionParam;
    window.__areas = [];
    window.__explored = [];
    window.__entities = [];
    const world = createWorld(canvas, {
      motion: () => motionOn,
      startTile: startXY || (startPlace ? startPlace.door : null),
      scale: params.get('scale') ? Number(params.get('scale')) : null,
      content,
      seed: params.get('seed') || 'hushlands',
      onPlaceClick: (id) => log.push(['place', id]),
      onCrewClick: (id) => log.push(['crew', id]),
      onMiloMove: (tile) => log.push(['move', tile.x, tile.y]),
      onEntityClick: (entity) => { log.push(['entity', entity.id]); window.__entities.push(entity); },
      onAreaChange: (info) => { window.__areas.push(info); window.__area = info; },
      onExplore: (keys) => window.__explored.push(...keys),
      onHover: (info) => {
        if (!info) { tip.style.display = 'none'; return; }
        const place = PLACES.find((p) => p.id === info.id);
        tip.textContent = info.label || (info.kind === 'place' ? (place ? place.name : info.id) : info.id);
        tip.style.display = 'block';
        tip.style.left = `${info.x + 14}px`;
        tip.style.top = `${info.y + 10}px`;
      },
    });
    world.setCrew(crewSets[params.get('crew') || 'default'] || crewSets.default);
    window.__world = world;
    window.__setMotion = (value) => { motionOn = value; };

    // ---------- demo rifts for the wilds (synthetic, from the rift generator) ----------

    let riftgen = null;
    if (content) {
      const { createRiftgen } = await import('../src/world/riftgen.js');
      riftgen = createRiftgen({ words: content.riftgen, genres: content.genres });
    }
    // A spec with exactly these genres at this stage: wild rifts leaning hard on them, seed by seed.
    function specFor(genres, stage, { depth = 1, tier = 2, salt = 0 } = {}) {
      const weights = Object.fromEntries(content.genres.genres.map((g) => [g.id, genres.includes(g.id) ? 400 : 0.0001]));
      for (let seed = 1 + salt * 7919; seed < 12000 + salt * 7919; seed += 1) {
        const spec = riftgen.wildRift({ seed, tier, depth, weights });
        if (spec.stage === stage && spec.genres.length === genres.length && genres.every((g) => spec.genres.includes(g))) return spec;
      }
      return null;
    }
    function demoRift(text, salt = 0) {
      const [genrePart, stage = 'open', at = '0,0', flag = ''] = text.split(':');
      const [x, y] = at.split(',').map(Number);
      const spec = specFor(genrePart.split(/[+ |]/), stage, { salt });
      if (!spec) return null;
      return {
        id: spec.id, key: `demo:${spec.id}`, kind: 'real', realKind: 'knocking', spec, x, y, beyond: 10, towards: null,
        stage: spec.stage, urgency: 0.6, bright: false, warded: flag === 'warded' ? { until: 0, stage: spec.stage } : null,
        held: null, atWalls: false, cause: 'A demo rift for the preview.', stitch: 'Nothing to mend.', since: 0, echo: null, subject: null,
      };
    }
    window.__demo = { specFor, demoRift };

    if (content) {
      const tier = Number(params.get('tier') || 1);
      world.setWildState({
        day: Number(params.get('day') || 20000),
        tier,
        wardRadius: tier >= 2 ? 12 : 0,
        closed: [],
        lit: (params.get('lit') || '').split(',').filter(Boolean),
        opened: [],
        felled: {},
      });
      const riftList = (params.get('rifts') || '').split(';').filter(Boolean).map((text, i) => demoRift(text, i)).filter(Boolean);
      window.__rifts = riftList;
      if (riftList.length) world.setRifts(riftList);
      const echo = params.get('echo');
      if (echo) {
        const [place, icon, genre] = echo.split(':');
        world.setEchoes([{ id: 'echo:demo', riftId: 'rift:demo', place, icon, genre, label: 'An echo of a rift' }]);
      }
      const inside = params.get('elsewhere');
      if (inside) {
        const [genrePart, stage = 'open', depth = '1'] = inside.split(':');
        const spec = specFor(genrePart.split(/[+ |]/), stage, { depth: Number(depth), tier: 3 });
        if (spec) window.__inside = world.enterElsewhere({ id: spec.id, key: null, kind: 'wild', spec, x: null, y: null, stage: spec.stage });
      }
      // Phase 4 (CONTRACT-PHASE4.md §11): combat=<genre[+genre]>:<stage>[:room] makes a fight-ready
      // Elsewhere (encounters.prepareElsewhere) and starts that room's fight with a synthetic company;
      // combat=field starts a synthetic 16-actor fight round Milo in the wilds (a field boss's ground).
      // plan=1 shows the planner's overlay, round=1 plays a round, bench=1 times world.benchmark
      // (window.__bench). party=1 has the company follow Milo, camp=1 sits it round the fire,
      // sky=night|dusk|rain|snow sets the sky, bridge=1 stands the Last Bridge and the Tollkeeper,
      // skybench=1 times the sky's tint and weather on this page's own canvas (window.__skyBench).
      // Needs the whole bundle (MILO_PREVIEW_CONTENT=1, or an init script with combat's content).
      const phase4 = ['combat', 'party', 'camp', 'sky', 'bridge', 'skybench'].some((key) => params.has(key));
      // After the page's own setup below has run (previewPhase4 uses its constants).
      if (phase4) window.__phase4 = Promise.resolve().then(previewPhase4).catch((error) => { window.__errors.push(String((error && error.stack) || error)); });
    }

    // ---------- Phase 4 previews (synthetic: a made-up company, generated rifts, nothing real) ----------

    const COMPANY = [
      { id: 'milo', look: { kind: 'rig', rig: 'coat', who: 'milo', likeness: null }, name: 'Milo' },
      { id: 'claude', look: { kind: 'rig', rig: 'robe', who: 'claude', likeness: null }, name: 'The Scribe' },
      { id: 'codex', look: { kind: 'rig', rig: 'robe', who: 'codex', likeness: null }, name: 'The Artificer' },
      { id: 'jev', look: { kind: 'rig', rig: 'jev', who: 'jev', likeness: null }, name: 'Jev' },
    ];
    const heroOf = (h, at, i) => ({ id: h.id, side: 'party', rank: 'hero', talkKind: null, look: h.look, x: at.x, y: at.y, size: 1, facing: 'right', name: h.name, integrity: 20, max: 24, buffer: 0, offline: false, sorted: null, conditions: i === 1 ? [{ id: 'brisk', n: null }] : [], heat: [20, 45, 75, 10][i], bar: null });
    const foeOf = (u) => ({ id: u.id, side: u.side, rank: u.rank, talkKind: u.talkKind, look: u.look, x: u.post.x, y: u.post.y, size: u.size, facing: 'left', name: u.name, integrity: u.integrity, max: u.maxIntegrity, buffer: 0, offline: false, sorted: null, conditions: [], heat: 35, bar: null });

    async function previewPhase4() {
      const skyName = params.get('sky');
      if (skyName) {
        const { skyAt } = await import('../src/sky.js');
        const at = { night: [23, 0], dusk: [18, 55], rain: [13, 0], snow: [13, 0] }[skyName] || [12, 0];
        const sky = skyAt(new Date(2026, 9, 14, at[0], at[1]).getTime(), { sky: content.sky || null });
        const weather = skyName === 'rain' ? { kind: 'rain', density: 0.004, key: 'w' } : skyName === 'snow' ? { kind: 'snow', density: 0.003, key: 'c' } : sky.weather;
        world.setSky({ ...sky, weather });
      }
      if (params.get('party') === '1') world.setParty(COMPANY.slice(1).map(({ id, look, name }) => ({ id, look, name })));
      if (params.get('camp') === '1') {
        world.setCamp({
          night: skyName === 'night',
          members: COMPANY.slice(1).map(({ id, look }, i) => ({ id, look, seat: [2, 3, 0][i], pose: ['sit', 'talk', 'sleep'][i], bubble: i === 0 }))
            .concat([{ id: 'tollkeeper', look: { kind: 'rig', rig: 'toll', who: 'tollkeeper', likeness: null }, seat: 6, pose: 'sit', bubble: false }]),
          props: ['handcart', 'breather-tea', 'paper-lantern'],
        });
      }
      if (params.get('bridge') === '1') {
        const { lastBridge, bridgeLandmarks } = await import('../src/world/trail.js');
        const bridge = lastBridge(world.worldgen);
        if (bridge) {
          world.setLandmarks(bridgeLandmarks(bridge));
          await world.travelTo({ x: bridge.stand.x, y: bridge.stand.y + 2 });
          window.__bridge = bridge;
        }
      }
      if (params.get('skybench') === '1') window.__skyBench = await skyBench();
      const combat = params.get('combat');
      if (!combat) return null;
      const { benchView } = await import('../src/world/scene-combat.js');
      let view;
      let overlay = null;
      if (combat === 'field') {
        const tile = world.miloTile();
        ({ view, overlay } = benchView({ x: tile.x + 4, y: tile.y }, { actors: 16 }));
      } else {
        const [genrePart, stage = 'open', roomText = '0'] = combat.split(':');
        const spec = specFor(genrePart.split(/[+ |]/), stage, { tier: 3 });
        const c = content.combat || {};
        const { prepareElsewhere } = await import('../src/combat/encounters.js');
        const prep = prepareElsewhere(spec, { riftgen, genres: content.genres, words: content.riftgen, kind: 'wild', roadLevel: 3, partySize: 4, rules: c.rules, leads: c.leads, foes: c.foes, tuning: c.tuning || null, hooks: [] });
        await world.enterElsewhere({ id: spec.id, key: null, kind: 'wild', spec, x: null, y: null, stage: spec.stage }, { layout: prep.layout, fight: { plan: prep.plan, encounters: prep.encounters } });
        const rooms = prep.encounters.rooms;
        const room = rooms[Math.min(rooms.length - 1, Number(roomText) || 0)];
        const fight = room.fight;
        const foes = [...fight.foes, ...(fight.leadUnit ? [fight.leadUnit] : [])];
        const units = [...COMPANY.map((h, i) => heroOf(h, fight.arena.entry[i] || fight.arena.entry[0], i)), ...foes.map(foeOf)];
        const telegraphs = foes.map((u, i) => ({ unitId: u.id, slot: 0, tick: 1, icon: ['bite', 'strike', 'shoot', 'cast'][i % 4], words: 'Bite Milo', targets: ['milo'], tiles: [], hidden: i === 2, falseTarget: null, adapting: null, aside: false }));
        view = { arena: fight.arena, units, objects: fight.objects, surfaces: fight.surfaces, lights: [{ id: 'hooklight', x: units[0].x, y: units[0].y, radius: 3, rounds: null, source: 'milo' }], telegraphs };
        // The room's idle posts, the Tale-lead object and any wanderer in the arena step aside for the combatants.
        const r = fight.arena.rect;
        const wanderers = world.elsewhereEntities().filter((e) => e.kind === 'stray' && !e.id.startsWith('enc:') && e.x >= r.x && e.y >= r.y && e.x < r.x + r.w && e.y < r.y + r.h).map((e) => e.id);
        world.hideActors([`enc:${room.roomId}`, ...(room.roomId === 'lead' ? ['tale-lead'] : []), ...wanderers]);
        overlay = planFor(view);
        window.__room = { roomId: room.roomId, rect: r, units: units.length };
      }
      await world.startCombat(view);
      if (params.get('plan') === '1') world.showOverlay(overlay);
      window.__view = view;
      if (params.get('round') === '1') window.__round = world.playEvents(sampleRound(view), { speed: 1 });
      if (params.get('bench') === '1') window.__bench = world.benchmark({ frames: 200, actors: 16 });
      return view;
    }

    // The sky's budgets (§11.4: the tint at most 0.3 ms a frame, weather at most 1 ms) in Chromium's own
    // canvas: a night tint with 12 lights shining through and the densest rain, over the art-pixel view
    // a 1280×820 window shows at 3×, each timed over 300 frames after 50 to warm up: as drawn (20 frames
    // a sample, the clock being coarse), and with a one-pixel readback (the drawing done, not just
    // queued) less the readback alone. → { tint, weather, tintFlushed, weatherFlushed, readback } ms.
    async function skyBench() {
      const { createSkyLayer } = await import('../src/world/scene-sky.js');
      const make = (w, h) => Object.assign(document.createElement('canvas'), { width: w, height: h });
      const glows = new Map();
      const glow = (r, alpha) => {
        const key = `${r}:${alpha}`;
        if (!glows.has(key)) {
          const c = make(r * 2, r * 2);
          const g = c.getContext('2d');
          const fill = g.createRadialGradient(r, r, 0, r, r, r);
          fill.addColorStop(0, `rgba(255,214,150,${alpha})`);
          fill.addColorStop(1, 'rgba(255,214,150,0)');
          g.fillStyle = fill;
          g.fillRect(0, 0, r * 2, r * 2);
          glows.set(key, c);
        }
        return glows.get(key);
      };
      const sky = createSkyLayer({ makeCanvas: make, lights: () => Array.from({ length: 12 }, (_, i) => ({ x: 20 + i * 32, y: 90 + (i % 3) * 40, r: 16 + (i % 4) * 6, alpha: 0.8 })), glow });
      sky.setSky({ tint: [40, 50, 110, 0.38], light: 0, night: true, weather: { kind: 'rain', density: 0.01, key: 'w' }, key: 'bench' });
      const view = { x: 0, y: 0, w: Math.ceil(1280 / 3), h: Math.ceil(820 / 3) };
      const target = make(view.w + 1, view.h + 1).getContext('2d');
      const time = (fn, flush, batch = 1, less = 0) => {
        const times = [];
        for (let i = 0; i < 350; i += 1) {
          const t0 = performance.now();
          for (let j = 0; j < batch; j += 1) fn(i * batch + j);
          if (flush) target.getImageData(0, 0, 1, 1);
          if (i >= 50) times.push((performance.now() - t0) / batch - less);
        }
        times.sort((a, b) => a - b);
        return { median: times[times.length >> 1], p90: times[Math.floor(times.length * 0.9)] };
      };
      const tint = () => sky.tint(target, view, 1000);
      const weather = (i) => sky.above(target, () => true, 1000 + i * 33, view);
      const readback = time(() => target.fillRect(0, 0, 1, 1), true);
      return {
        tint: time(tint, false, 20), weather: time(weather, false, 20), readback,
        tintFlushed: time(tint, true, 1, readback.median), weatherFlushed: time(weather, true, 1, readback.median),
      };
    }

    // A plausible planning overlay: Milo's reach, a path toward the first foe, an area round it.
    function planFor(view) {
      const { rect, cells } = view.arena;
      const at = (x, y) => cells[(y - rect.y) * rect.w + (x - rect.x)];
      const milo = view.units[0];
      const foe = view.units.find((u) => u.side === 'foe') || milo;
      const taken = new Set(view.units.map((u) => `${u.x},${u.y}`));
      const reachable = [];
      for (let y = rect.y; y < rect.y + rect.h; y += 1) {
        for (let x = rect.x; x < rect.x + rect.w; x += 1) {
          const dx = Math.abs(x - milo.x);
          const dy = Math.abs(y - milo.y);
          if (Math.max(dx, dy) + Math.floor(Math.min(dx, dy) / 2) <= 4 && (at(x, y) === '.' || at(x, y) === '=') && !taken.has(`${x},${y}`)) reachable.push({ x, y });
        }
      }
      const path = [];
      let p = { x: milo.x, y: milo.y };
      for (let i = 0; i < 3; i += 1) {
        p = { x: p.x + Math.sign(foe.x - p.x), y: p.y + Math.sign(foe.y - p.y) };
        if (!reachable.some((t) => t.x === p.x && t.y === p.y)) break;
        path.push(p);
      }
      const area = [];
      for (let dy = -1; dy <= 1; dy += 1) for (let dx = -1; dx <= 1; dx += 1) area.push({ x: foe.x + dx, y: foe.y + dy });
      const caught = view.units.filter((u) => area.some((t) => t.x === u.x && t.y === u.y)).map((u) => u.id);
      const cover = [];
      for (let y = rect.y; y < rect.y + rect.h; y += 1) for (let x = rect.x; x < rect.x + rect.w; x += 1) if (at(x, y) === 'o' || at(x, y) === 'O') cover.push({ x, y, level: at(x, y) === 'O' ? 2 : 1 });
      return { reachable, path: { tiles: path, cost: path.length, of: 5, swipes: path.slice(-1) }, areas: [{ tiles: area, kind: 'harm', caught }], threats: [{ x: milo.x, y: milo.y }], cover, telegraphs: view.telegraphs, selected: 'milo', targets: [foe.id], cursor: path[path.length - 1] || { x: milo.x, y: milo.y } };
    }

    // A round of made-up events to watch play: a stride, a Critical, a spell, a settle.
    function sampleRound(view) {
      const [milo, scribe] = view.units;
      const foes = view.units.filter((u) => u.side === 'foe');
      const f = foes[0];
      const g = foes[1] || f;
      const taken = new Set(view.units.map((u) => `${u.x},${u.y}`));
      const { rect, cells } = view.arena;
      const free = (t) => !taken.has(`${t.x},${t.y}`) && cells[(t.y - rect.y) * rect.w + (t.x - rect.x)] === '.';
      const step = [[1, 0], [0, 1], [0, -1], [-1, 0]].map(([dx, dy]) => ({ x: milo.x + dx, y: milo.y + dy })).find(free) || { x: milo.x, y: milo.y };
      return [
        { t: 'tick', round: 1, tick: 1 },
        { t: 'act', round: 1, tick: 1, unit: 'milo', action: { id: 'stride' } },
        { t: 'move', round: 1, tick: 1, unit: 'milo', by: null, path: [step], how: 'stride' },
        { t: 'act', round: 1, tick: 1, unit: f.id, action: { id: 'strike', target: { unit: 'milo' } } },
        { t: 'outcome', round: 1, tick: 1, unit: f.id, target: 'milo', degree: 'crit', bars: [15, 60, 15, 10], k: 0 },
        { t: 'damage', round: 1, tick: 1, unit: f.id, target: 'milo', amount: 9, kind: 'static', degree: 'crit', integrity: 11, max: 24 },
        { t: 'tick', round: 1, tick: 2 },
        { t: 'act', round: 1, tick: 2, unit: scribe.id, action: { id: 'use', ability: 'inkdarts', target: { unit: g.id } } },
        { t: 'outcome', round: 1, tick: 2, unit: scribe.id, target: g.id, degree: 'hit', bars: [5, 80, 10, 5], k: 1 },
        { t: 'damage', round: 1, tick: 2, unit: scribe.id, target: g.id, amount: 6, kind: 'ink', degree: 'hit', integrity: 0, max: g.max },
        { t: 'sorted', round: 1, tick: 2, unit: g.id, how: 'settled' },
      ];
    }

    function placeBubble() {
      const pos = world.miloScreenPos();
      bubble.style.left = `${pos.x}px`;
      bubble.style.top = `${pos.y}px`;
      requestAnimationFrame(placeBubble);
    }

    if (params.get('view') === 'overview') {
      document.body.classList.add('overview');
      canvas.style.display = 'none';
      const scale = Number(params.get('ovscale') || 1);
      const map = world.renderMap(scale, { time: 1200, milo: params.get('milo') !== '0' });
      window.__overview = map.toDataURL('image/png');
    }
    if (params.get('bubble') === '1') {
      bubble.style.display = 'block';
      placeBubble();
    }
    if (params.get('entrance') === '1') {
      window.__entrance = world.entrance().then(() => { window.__entered = true; });
    }
    window.__ready = true;
    canvas.focus();
  </script>
