<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'none'; object-src 'none'; base-uri 'none'">
  <title>MILO world preview</title>
  <style>
    :root { color-scheme: light; }
    html, body { margin: 0; height: 100%; background: #5b9169; overflow: hidden; font: 13px/1.35 "Segoe UI", system-ui, sans-serif; color: #3d4038; }
    #world { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; outline: none; }
    #tip { position: fixed; pointer-events: none; padding: 4px 8px; background: #fff6e2; border: 2px solid #3d4038; box-shadow: 0 3px 0 #3d4038; display: none; white-space: nowrap; }
    #bubble { position: fixed; transform: translate(-50%, calc(-100% - 10px)); padding: 6px 10px; background: #fff6e2; border: 2px solid #3d4038; box-shadow: 0 3px 0 #3d4038; display: none; max-width: 260px; }
    #overview { display: none; image-rendering: pixelated; }
    body.sheet, body.overview { overflow: auto; background: #aad48f; }
  </style>
</head>
<body>
  <canvas id="world" aria-label="Milo's world. Use the arrow keys to walk."></canvas>
  <div id="tip" role="status"></div>
  <div id="bubble">Hi, Chris. All quiet while you were away.</div>
  <script type="module">
    // The world on its own, for screenshots (scripts/capture-world.mjs, capture-wilds.mjs and
    // friends). Query: at=<place id> | x=&y= (start tile), crew=default|rest|busy, motion=0,
    // scale=N, view=overview (milo=0 leaves him out of it), bubble=1, entrance=1. With content injected by an init script
    // (window.__content = { genres, riftgen, fortress, wilds, story }) the wilds come on too:
    // tier=N, day=N, seed=..., rifts=<genre[+genre]:stage:x,y[:warded]>;..., echo=<place:icon:genre>,
    // lit=<lantern ids, comma-separated>, elsewhere=<genre[+genre]:stage[:depth]>.
    // Every rift here is synthetic, built by the rift generator; nothing real is shown.
    import { createWorld } from '../src/world/engine.js';
    import { PLACES } from '../src/world/map.js';

    const params = new URLSearchParams(location.search);
    const canvas = document.getElementById('world');
    const tip = document.getElementById('tip');
    const bubble = document.getElementById('bubble');
    const motionParam = params.get('motion') !== '0';
    const content = window.__content || null;
    const log = [];
    window.__log = log;
    window.__errors = [];
    window.addEventListener('error', (e) => window.__errors.push(String(e.message)));

    const crewSets = {
      default: [
        { id: 'claude', state: 'working', label: 'Claude Code', count: 2 },
        { id: 'codex', state: 'needs-you', label: 'Codex', count: 1 },
        { id: 'jev', state: 'working', label: 'Jev', count: 0 },
        { id: 'whisper', state: 'idle', label: 'Whisper', count: 0 },
        { id: 'ollama', state: 'idle', label: 'Ollama', count: 0 },
        { id: 'helper-a', state: 'done', label: 'Helper', count: 0 },
      ],
      rest: [
        { id: 'claude', state: 'done', label: 'Claude Code', count: 0 },
        { id: 'codex', state: 'done', label: 'Codex', count: 0 },
        { id: 'jev', state: 'idle', label: 'Jev', count: 0 },
        { id: 'whisper', state: 'idle', label: 'Whisper', count: 0 },
        { id: 'ollama', state: 'offline', label: 'Ollama', count: 0 },
      ],
      busy: [
        { id: 'claude', state: 'working', label: 'Claude Code', count: 3 },
        { id: 'codex', state: 'working', label: 'Codex', count: 1 },
        { id: 'ollama', state: 'working', label: 'Ollama', count: 1 },
        { id: 'helper-b', state: 'working', label: 'Helper', count: 1 },
        { id: 'helper-c', state: 'needs-you', label: 'Another helper', count: 1 },
        { id: 'jev', state: 'working', label: 'Jev', count: 0 },
        { id: 'whisper', state: 'idle', label: 'Whisper', count: 0 },
      ],
    };

    const start = params.get('at');
    const startPlace = start ? PLACES.find((p) => p.id === start) : null;
    const startXY = params.has('x') && params.has('y') ? { x: Number(params.get('x')), y: Number(params.get('y')) } : null;
    let motionOn = motionParam;
    window.__areas = [];
    window.__explored = [];
    window.__entities = [];
    const world = createWorld(canvas, {
      motion: () => motionOn,
      startTile: startXY || (startPlace ? startPlace.door : null),
      scale: params.get('scale') ? Number(params.get('scale')) : null,
      content,
      seed: params.get('seed') || 'hushlands',
      onPlaceClick: (id) => log.push(['place', id]),
      onCrewClick: (id) => log.push(['crew', id]),
      onMiloMove: (tile) => log.push(['move', tile.x, tile.y]),
      onEntityClick: (entity) => { log.push(['entity', entity.id]); window.__entities.push(entity); },
      onAreaChange: (info) => { window.__areas.push(info); window.__area = info; },
      onExplore: (keys) => window.__explored.push(...keys),
      onHover: (info) => {
        if (!info) { tip.style.display = 'none'; return; }
        const place = PLACES.find((p) => p.id === info.id);
        tip.textContent = info.label || (info.kind === 'place' ? (place ? place.name : info.id) : info.id);
        tip.style.display = 'block';
        tip.style.left = `${info.x + 14}px`;
        tip.style.top = `${info.y + 10}px`;
      },
    });
    world.setCrew(crewSets[params.get('crew') || 'default'] || crewSets.default);
    window.__world = world;
    window.__setMotion = (value) => { motionOn = value; };

    // ---------- demo rifts for the wilds (synthetic, from the rift generator) ----------

    let riftgen = null;
    if (content) {
      const { createRiftgen } = await import('../src/world/riftgen.js');
      riftgen = createRiftgen({ words: content.riftgen, genres: content.genres });
    }
    // A spec with exactly these genres at this stage: wild rifts leaning hard on them, seed by seed.
    function specFor(genres, stage, { depth = 1, tier = 2, salt = 0 } = {}) {
      const weights = Object.fromEntries(content.genres.genres.map((g) => [g.id, genres.includes(g.id) ? 400 : 0.0001]));
      for (let seed = 1 + salt * 7919; seed < 12000 + salt * 7919; seed += 1) {
        const spec = riftgen.wildRift({ seed, tier, depth, weights });
        if (spec.stage === stage && spec.genres.length === genres.length && genres.every((g) => spec.genres.includes(g))) return spec;
      }
      return null;
    }
    function demoRift(text, salt = 0) {
      const [genrePart, stage = 'open', at = '0,0', flag = ''] = text.split(':');
      const [x, y] = at.split(',').map(Number);
      const spec = specFor(genrePart.split(/[+ |]/), stage, { salt });
      if (!spec) return null;
      return {
        id: spec.id, key: `demo:${spec.id}`, kind: 'real', realKind: 'knocking', spec, x, y, beyond: 10, towards: null,
        stage: spec.stage, urgency: 0.6, bright: false, warded: flag === 'warded' ? { until: 0, stage: spec.stage } : null,
        held: null, atWalls: false, cause: 'A demo rift for the preview.', stitch: 'Nothing to mend.', since: 0, echo: null, subject: null,
      };
    }
    window.__demo = { specFor, demoRift };

    if (content) {
      const tier = Number(params.get('tier') || 1);
      world.setWildState({
        day: Number(params.get('day') || 20000),
        tier,
        wardRadius: tier >= 2 ? 12 : 0,
        closed: [],
        lit: (params.get('lit') || '').split(',').filter(Boolean),
        opened: [],
        felled: {},
      });
      const riftList = (params.get('rifts') || '').split(';').filter(Boolean).map((text, i) => demoRift(text, i)).filter(Boolean);
      window.__rifts = riftList;
      if (riftList.length) world.setRifts(riftList);
      const echo = params.get('echo');
      if (echo) {
        const [place, icon, genre] = echo.split(':');
        world.setEchoes([{ id: 'echo:demo', riftId: 'rift:demo', place, icon, genre, label: 'An echo of a rift' }]);
      }
      const inside = params.get('elsewhere');
      if (inside) {
        const [genrePart, stage = 'open', depth = '1'] = inside.split(':');
        const spec = specFor(genrePart.split(/[+ |]/), stage, { depth: Number(depth), tier: 3 });
        if (spec) window.__inside = world.enterElsewhere({ id: spec.id, key: null, kind: 'wild', spec, x: null, y: null, stage: spec.stage });
      }
    }

    function placeBubble() {
      const pos = world.miloScreenPos();
      bubble.style.left = `${pos.x}px`;
      bubble.style.top = `${pos.y}px`;
      requestAnimationFrame(placeBubble);
    }

    if (params.get('view') === 'overview') {
      document.body.classList.add('overview');
      canvas.style.display = 'none';
      const scale = Number(params.get('ovscale') || 1);
      const map = world.renderMap(scale, { time: 1200, milo: params.get('milo') !== '0' });
      window.__overview = map.toDataURL('image/png');
    }
    if (params.get('bubble') === '1') {
      bubble.style.display = 'block';
      placeBubble();
    }
    if (params.get('entrance') === '1') {
      window.__entrance = world.entrance().then(() => { window.__entered = true; });
    }
    window.__ready = true;
    canvas.focus();
  </script>
</body>
</html>
